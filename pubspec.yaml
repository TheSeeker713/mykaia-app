name: mykaia_app
description: MyKAIA — Keep At It, Always. Local-first neurodivergent multitool.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  drift: ^2.28.0
  sqlite3: ^3.2.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  webview_flutter: ^4.13.0
  flutter_gemma: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

# SQLite3MultipleCiphers for journal encryption (replaces obsolete sqlcipher_flutter_libs).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
